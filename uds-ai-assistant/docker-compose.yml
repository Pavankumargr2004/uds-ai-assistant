services:
  api:
    build: .
    command: ["uds-ai", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    environment:
      - UDS_DATA_DIR=/app/data
      - UDS_AUTH_MODE=dev
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/uds
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - db
      - neo4j

  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "uds_assistant/ui/app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports: ["8501:8501"]
    volumes: ["./data:/app/data"]
    environment:
      - UDS_DATA_DIR=/app/data
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/uds
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - api

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uds
    ports: ["5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: none
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]

volumes:
  db_data:
  neo4j_data:
